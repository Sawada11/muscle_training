# ==============================
# DB設定（MySQL 5.7）
# ==============================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/muscletrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Tokyo
spring.datasource.username=user
spring.datasource.password=password

# ==============================
# JPA / Hibernate設定
# ※ Hibernate 6.xでは MySQL 5.7 は非推奨のため、community dialectで対応
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Hibernate 6 以降 + MySQL 5.7 では community dialect を明示
spring.jpa.database-platform=org.hibernate.community.dialect.MySQL57Dialect

# ==============================
# Hibernate open-in-view の警告対策（任意でOFF）
# ==============================
spring.jpa.open-in-view=false

# ==============================
# ログ設定（開発用）
# ==============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


logging.level.root=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.example=DEBUG

# ==============================
# JWT設定（例）
# ==============================
# jwt.secret=my-secret-key
# jwt.expiration=86400000

# ==============================
# Firebase通知（例）
# ==============================
# firebase.credentials.path=classpath:firebase-service-account.json

# ==============================
# Spring Bootサーバーを全IPから受け付ける
# ==============================
server.port=8080
server.address=0.0.0.0
